<!doctype html>
<html lang="en">
	<!-- Bootstrap JS Include -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
		crossorigin="anonymous"
		async
	></script>

	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Opt out of Chrome/Android auto darkening (e.g. Pixel dark theme) -->
		<meta name="color-scheme" content="only light" />
		%sveltekit.head%

		<!-- Bootstrap CSS -->
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
			rel="stylesheet"
			integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
			crossorigin="anonymous"
		/>

		<!-- Splide CSS is imported from the @splidejs npm packages in the
		components themselves; see Hero-Carousel.svelte and Carousel.svelte -->

		<!-- Carousel CSS -->
		<link rel="stylesheet" href="%sveltekit.assets%/assets/styles/carousel.css" />

		<!-- Website CSS -->
		<link rel="stylesheet" href="%sveltekit.assets%/assets/styles/styles.css" />
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
